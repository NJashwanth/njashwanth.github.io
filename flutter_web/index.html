<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/flutter_web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>portfolio_flutter</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html[data-theme="dark"],
    html[data-theme="dark"] body {
      background: #181d1f;
      color: #e6ece9;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
  const applyTheme = (theme) => {
    const nextTheme = theme === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", nextTheme);
    document.body.setAttribute("data-theme", nextTheme);
    document.documentElement.classList.toggle("dark", nextTheme === "dark");
  };

  window.addEventListener("message", (event) => {
    if (typeof event.data === "string" && event.data.startsWith("theme:")) {
      applyTheme(event.data.replace("theme:", ""));
    }
  });

  try {
    if (window.parent && window.parent !== window && window.parent.document) {
      const parentTheme = window.parent.document.body.getAttribute("data-theme");
      applyTheme(parentTheme || "light");
    }
  } catch (_err) {
    applyTheme("light");
  }

  window.getParentTheme = () => {
    return document.documentElement.classList.contains("dark")
      ? "dark"
      : "light";
  };

  window.setThemeCallback = (cb) => {
    new MutationObserver(() => {
      const theme = document.documentElement.classList.contains("dark")
        ? "dark"
        : "light";
      cb(`theme:${theme}`);
    }).observe(document.documentElement, { attributes: true });
  };
</script>
</body>
</html>
