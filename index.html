<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="author" content="%PERSON_NAME%" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="%PERSON_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%PERSON_NAME%, %PERSON_ROLE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Runs before first paint: apply the saved theme, and resolve the motion
      // setting (URL ?motion=full|reduced, then localStorage, then the OS) the
      // same way src/lib/motion.ts does, so CSS and JS agree from frame one.
      (function () {
        var d = document.documentElement;
        var m = null;
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
          var p = new URLSearchParams(location.search).get('motion');
          if (p === 'full' || p === 'reduced') localStorage.setItem('motion', (m = p));
          else {
            var s = localStorage.getItem('motion');
            if (s === 'full' || s === 'reduced') m = s;
          }
        } catch (e) {}
        d.dataset.motion = m || (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full');
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "%PERSON_NAME%",
        "jobTitle": "%PERSON_ROLE%",
        "url": "%SITE_URL%",
        "address": { "@type": "PostalAddress", "addressRegion": "MI", "addressCountry": "US" },
        "sameAs": ["%LINK_GITHUB%", "%LINK_LINKEDIN%"]
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
