<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="author" content="%PERSON_NAME%" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EDE8E0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171411" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="%PERSON_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%PERSON_NAME%, %PERSON_ROLE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Before first paint: mark JS as available and apply a saved theme so
      // there is no flash.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
        } catch (e) {}
        // Desktop with motion: hold the hero name until StringSplit has split it,
        // and never longer than 1.6s if the runtime is slow or fails.
        if (matchMedia('(min-width: 64rem) and (pointer: fine) and (prefers-reduced-motion: no-preference)').matches) {
          d.classList.add('st-intro');
          setTimeout(function () { d.classList.remove('st-intro'); }, 1600);
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "%PERSON_NAME%",
        "jobTitle": "%PERSON_ROLE%",
        "url": "%SITE_URL%",
        "address": { "@type": "PostalAddress", "addressRegion": "MI", "addressCountry": "US" },
        "sameAs": ["%LINK_GITHUB%", "%LINK_LINKEDIN%"]
      }
    </script>
  </head>
  <body>
    <!--app-html-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
